<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14231c">
  <title>Hovdemo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#dashboard"><span class="brandmark">H</span><span><b>Hovdemo</b><small data-i18n="tagline">Komplett hovslagerdemo</small></span></a>
  <div class="header-actions">
    <label class="language"><span>🌐</span><select id="languageSelect" aria-label="Language"><option value="nb">Norsk</option><option value="sv">Svenska</option><option value="en">English</option></select></label>
    <button class="icon-btn" id="resetDemo" title="Reset">↻</button>
    <button class="menu-btn" id="menuBtn">☰</button>
  </div>
</header>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <nav id="nav"></nav>
    <div class="sidebar-foot"><span data-i18n="offline">Offline demo</span><small>v3.0</small></div>
  </aside>
  <main>
    <section class="page-head"><div><p class="eyebrow" data-i18n="system">Hovslagersystem</p><h1 id="pageTitle"></h1><p id="pageSubtitle" class="muted"></p></div><button class="primary" id="pageAction"></button></section>
    <div id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><button class="modal-close" id="modalClose">×</button><div class="modal-card" id="modalCard"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
